<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Uskein Studio — OG card</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:#EDEBE4; }
  #card { position:relative; width:1200px; height:630px; font-family:'Archivo', Arial, sans-serif; }
  .grid { position:absolute; inset:0; opacity:.45;
    background-image:linear-gradient(to right,#C9C6BC 1px,transparent 1px),linear-gradient(to bottom,#C9C6BC 1px,transparent 1px);
    background-size:48px 48px; }
  .inner { position:relative; padding:56px 64px; height:100%; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:21px; letter-spacing:.16em; color:#575C58; text-transform:uppercase; }
  .brand i { width:14px; height:14px; background:#5A8F00; display:block; }
  h1 { font-family:'Archivo Black', Arial, sans-serif; font-size:76px; line-height:1.02; letter-spacing:-.045em; color:#14171C; margin:34px 0 0; text-transform:uppercase; max-width:850px; }
  h1 em { color:#5A8F00; font-style:normal; }
  .sub { font-size:25px; line-height:1.4; color:#575C58; margin-top:24px; max-width:760px; }
  .chips { display:flex; gap:10px; margin-top:26px; }
  .chips span { font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:.08em; border:2px solid #14171C; padding:8px 14px; }
  .footer { margin-top:auto; border-top:1px solid #C9C6BC; padding-top:20px; display:flex; justify-content:space-between; align-items:flex-end; }
  .footer strong { font-size:22px; color:#14171C; }
  .footer span { font-family:'IBM Plex Mono',monospace; font-size:17px; color:#575C58; }
  .mark { position:absolute; right:64px; top:56px; width:26px; height:26px; background:#C8FF3D; border:2px solid #14171C; }
</style>
</head>
<body>
<div id="card">
  <div class="grid"></div>
  <div class="mark"></div>
  <div class="inner">
    <div class="brand"><i></i>Uskein Studio · Agencia freelance</div>
    <h1>Tu idea, convertida en <em>software.</em></h1>
    <p class="sub">Aplicaciones móviles, aplicaciones web y sistemas transaccionales a la medida.</p>
    <div class="chips"><span>10 PROYECTOS</span><span>DEMOS EN VIDEO</span><span>SIN PLANTILLAS</span></div>
    <div class="footer">
      <div><strong>uskein.github.io</strong><br><span>WhatsApp +57 313 290 4451</span></div>
      <span>EL CÓDIGO Y LOS DATOS SON TUYOS</span>
    </div>
  </div>
</div>
</body>
</html>
